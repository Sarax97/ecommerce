<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNow — Home</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="logo">ShopNow</h1>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <section class="hero">
    <h2>Everyday tech, honest prices.</h2>
  </section>

  <section class="product-grid" id="featured-products">
    <div class="product">
      <img src="images/laptop.jpg" alt="Business Laptop">
      <h3>Business Laptop</h3>
      <p>AED 3,499</p>
      <button>Add to Cart</button>
    </div>

    <div class="product">
      <img src="images/phone.jpg" alt="Smartphone">
      <h3>Smartphone</h3>
      <p>AED 2,199</p>
      <button>Add to Cart</button>
    </div>

    <div class="product">
      <img src="images/headphones.jpg" alt="Wireless Headphones">
      <h3>Wireless Headphones</h3>
      <p>AED 449</p>
      <button>Add to Cart</button>
    </div>

    <div class="product">
      <img src="images/keyboard.png" alt="Mechanical Keyboard">
      <h3>Mechanical Keyboard</h3>
      <p>AED 299</p>
      <button>Add to Cart</button>
    </div>

    <div class="product">
      <img src="images/mouse.jpg" alt="Wireless Mouse">
      <h3>Wireless Mouse</h3>
      <p>AED 129</p>
      <button>Add to Cart</button>
    </div>

    <div class="product">
      <img src="images/monitor.jpg" alt="27-inch Monitor">
      <h3>27" Monitor</h3>
      <p>AED 999</p>
      <button>Add to Cart</button>
    </div>
  </section>

  <footer class="site-footer"><p>&copy; 2025 ShopNow.</p></footer>
  <script src="js/app.js"></script>
</body>
</html>
